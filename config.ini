; Profile fuer print_counter.py / test_connection.py.
; Ein Profil pro Disziplin, weil Eject-Length, Zeilenbreite und Zaehler
; unterschiedlich sein koennen.

[profile:LP]
; Luftpistole - kuerzeres Band. eject_length noch leer: erst per
; test_connection.py kalibrieren (siehe README, Abschnitt "Eject-Length
; kalibrieren"), dann hier eintragen.
baudrate = 9600
parity = N
xonxoff = false
rtscts = false
eject_length =
line_spacing =
encoding = cp850

; Zeichen-Spaltenbreite des Ausdrucks. Jede Template-Zeile wird automatisch
; rechtsbuendig auf diese Breite ausgerichtet (wie auf der vorgedruckten
; Scheibe). Per calibrate_width.py ermittelt: 66 Zeichen passen vollstaendig
; bis zum rechten Rand (bei 67 bricht das letzte Zeichen um).
line_width = 66

; Schuss pro Scheibe (1 oder 2). Kann pro Lauf mit --shots-per-sheet
; ueberschrieben werden, ohne die Config zu aendern.
shots_per_sheet = 2

counter_file = state/lp_counters.json
counters = starter, serie, schuss

; Bei welchen Zaehlern print_session.py farbig auf "neuer Stapel" hinweisen
; soll, wenn sich ihr Wert gegenueber der letzten Scheibe aendert (Schuss
; aendert sich ja bei jeder Scheibe und ist daher hier bewusst ausgelassen).
stack_change_counters = starter, serie

[counter:LP:starter]
; Startnummer des Schuetzen - erhoeht sich um 1 pro gedruckter Scheibe.
start = 1
step = 1

[counter:LP:serie]
; Seriennummer - erhoeht sich um 1 pro gedruckter Scheibe. Falls eine Serie
; mehrere Scheiben umfasst oder manuell hochgezaehlt werden soll, per
; --set serie=<wert> fuer den jeweiligen Lauf setzen statt hier step
; anzupassen.
start = 1
step = 1

[counter:LP:schuss]
; Schuss-Nummer(n) auf der Scheibe. range=true zeigt bei
; shots_per_sheet > 1 einen Bereich (z.B. "1-2"), bei shots_per_sheet = 1
; nur die einzelne Nummer. step=shots_per_sheet sorgt dafuer, dass die
; naechste Scheibe automatisch dort weitermacht, wo die vorige aufgehoert
; hat (z.B. 1-2, dann 3-4, ...).
start = 1
step = shots_per_sheet
range = true


[profile:LG]
; Luftgewehr - laengeres Band. eject_length = 144 ist der Wert aus der
; bestehenden Projekt-Notiz ("Wichtige Infos zum Druck": 1B 43 90 = 144).
baudrate = 9600
parity = N
xonxoff = false
rtscts = false
eject_length = 144
line_spacing =
encoding = cp850
line_width = 66
shots_per_sheet = 2
counter_file = state/lg_counters.json
counters = starter, serie, schuss
stack_change_counters = starter, serie

[counter:LG:starter]
start = 1
step = 1

[counter:LG:serie]
start = 1
step = 1

[counter:LG:schuss]
start = 1
step = shots_per_sheet
range = true
